<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BNH Revisited</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container text-center mt-5">
    <h2 class="mb-4">Bear, Ninja, Hunter</h2>

    <div class="d-flex justify-content-center">
      <p>Play against the computer!</p>
    </div>
    <div class="d-flex justify-content-center">
      <ul class="text-start">
        <li>The Bear Beats the Hunter.</li>
        <li>The Human beats the Ninja.</li>
        <li>And the Ninja beats the Bear.</li>
      </ul>
    </div>
    <div class="d-flex justify-content-center">
      <p>Click a button below to select your choice.</p>
    </div>

    <hr class="custom-hr" />

    <div class="btn-group mb-3" role="group">
      <button class="btn btn-primary" onclick="playGame('Bear')">Bear</button>
      <button class="btn btn-primary" onclick="playGame('Human')">Human</button>
      <button class="btn btn-primary" onclick="playGame('Ninja')">Ninja</button>
    </div>

    <hr class="custom-hr" />

    <div class="d-flex justify-content-center">
      <div id="resultBox" class="border p-3 mx-auto mt-3 bg-light-subtle w-50 d-none">
        <p id="resultText" class="fw-bold fs-5 text-start"></p>
      </div>
    </div>

    <div class="d-flex justify-content-center">
      <div id="winCounter" class="mt-3 d-none">
        <p id="winText" class="fw-semibold fs-6"></p>
      </div>
    </div>

    <div class="d-flex justify-content-center">
      <button id="playAgainBtn" class="btn btn-secondary mt-3 d-none" onclick="resetGame()">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
